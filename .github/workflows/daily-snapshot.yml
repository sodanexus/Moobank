name: Moobank — snapshot quotidien

on:
  schedule:
    # Deux passages chaque jour, autorisés même si GitHub démarre en retard.
    # Paris : 03 h 15 / 06 h 15 en hiver, 04 h 15 / 07 h 15 en été.
    # Le second passage met à jour le même point quotidien (upsert).
    - cron: '15 2 * * *'
    - cron: '15 5 * * *'
  workflow_dispatch: # permet un lancement manuel depuis GitHub

permissions:
  contents: read

concurrency:
  group: moobank-daily-patrimoine-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: |
          npm run check
          npm test

      - name: Run snapshot
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
          USER_IDS: ${{ secrets.SNAPSHOT_USER_IDS }}
        run: node scripts/daily-snapshot.js
