name: Moobank — snapshot quotidien

on:
  schedule:
    # Deux créneaux UTC couvrent automatiquement les changements d’heure.
    # Le script n’écrit que pendant l’exécution correspondant à minuit à Paris.
    - cron: '15 22 * * *'
    - cron: '15 23 * * *'
  workflow_dispatch: # permet un lancement manuel depuis GitHub

permissions:
  contents: read

concurrency:
  group: moobank-daily-patrimoine-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate application
        run: |
          npm run check
          npm test

      - name: Run snapshot
        env:
          SUPA_URL: ${{ secrets.SUPA_URL }}
          SUPA_KEY: ${{ secrets.SUPA_SERVICE_KEY }}
          USER_IDS: ${{ secrets.SNAPSHOT_USER_IDS }}
        run: node scripts/daily-snapshot.js
